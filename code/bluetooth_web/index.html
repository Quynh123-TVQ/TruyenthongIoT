<!doctype html><html lang="vi"><meta charset="utf-8"><title>TVQ · Bluetooth Lab</title><style>body{font:17px system-ui;background:#eef4f6;color:#173b43;max-width:850px;margin:40px auto;padding:20px}button,select{padding:12px;margin:5px;border:1px solid #86a6af;border-radius:8px}button{cursor:pointer;background:#d6eeea}canvas{background:white;width:100%;border-radius:10px}pre{white-space:pre-wrap}small{color:#526970}</style><h1>TVQ · Trạm Bluetooth</h1><p>HC-05 / COM ảo → Node.js → WebSocket → trình duyệt</p><select id="ports"></select><button id="refresh">Quét cổng</button><button id="connect">Kết nối</button><button id="on" disabled>Bật LED</button><button id="off" disabled>Tắt LED</button><button id="disconnect" disabled>Ngắt</button><p id="status">Chưa kết nối</p><h2 id="values">Chờ nhiệt độ và độ ẩm…</h2><canvas width="800" height="240" id="chart"></canvas><small>Đồ thị chỉ có dữ liệu nhận từ Serial, không tự sinh số đo.</small><pre id="log"></pre><script>
const $=id=>document.getElementById(id);let points=[];
function connected(v){$('on').disabled=$('off').disabled=$('disconnect').disabled=!v;$('connect').disabled=v;$('status').textContent=v?'Đã mở Serial':'Đã ngắt';}
async function post(url,obj={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}),b=await r.json();if(!r.ok)throw Error(b.error);return b;}
function log(t){$('log').textContent=(t+'\n'+$('log').textContent).slice(0,4000);}
$('refresh').onclick=async()=>{try{const r=await fetch('/ports'),list=await r.json();if(!r.ok)throw Error(list.error);$('ports').replaceChildren(...list.map(p=>{const o=document.createElement('option');o.value=p.path;o.textContent=p.path;return o;}));}catch(e){log(e.message);}};
$('connect').onclick=async()=>{try{await post('/connect',{port:$('ports').value});connected(true);}catch(e){log(e.message);}};
for(const cmd of ['ON','OFF'])$(cmd.toLowerCase()).onclick=()=>post('/led',{cmd}).catch(e=>log(e.message));
$('disconnect').onclick=async()=>{try{await post('/disconnect');connected(false);}catch(e){log(e.message);}};
const socket=new WebSocket('ws://'+location.host);socket.onclose=()=>connected(false);socket.onmessage=e=>{const b=JSON.parse(e.data);if(b.connected===false)connected(false);log(JSON.stringify(b));if(Number.isFinite(b.temp)&&Number.isFinite(b.hum)){$('values').textContent=`${b.temp} °C · ${b.hum} %`;points.push(b.temp);points=points.slice(-60);draw();}};
function draw(){const ctx=$('chart').getContext('2d');ctx.clearRect(0,0,800,240);ctx.strokeStyle='#0c877c';ctx.beginPath();points.forEach((v,i)=>{const x=25+i*750/59,y=215-Math.max(0,Math.min(60,v))*3;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.fillStyle='#31525b';ctx.fillText('0–60 °C | 60 mẫu gần nhất',20,20);}
$('refresh').click();draw();
</script></html>
