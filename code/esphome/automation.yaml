# Paste one item into automations.yaml. Replace entity IDs using Developer Tools > States.
- id: tvq_temperature_led
  alias: TVQ - LED theo nhiet do
  mode: restart
  triggers:
    - trigger: numeric_state
      entity_id: sensor.tvq_wemos_tvq_temperature
      above: 30
    - trigger: numeric_state
      entity_id: sensor.tvq_wemos_tvq_temperature
      below: 28
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions: "{{ states('sensor.tvq_wemos_tvq_temperature') | float(-99) > 30 }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.tvq_wemos_tvq_led
        - conditions: "{{ is_number(states('sensor.tvq_wemos_tvq_temperature')) and states('sensor.tvq_wemos_tvq_temperature') | float < 28 }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.tvq_wemos_tvq_led
